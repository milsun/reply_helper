<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <span class="header-dot"></span>
        <span class="header-title">Reply Helper</span>
      </div>
      <div class="header-actions">
        <button id="thinking-btn" class="icon-btn thinking-toggle" title="Enable thinking / reasoning" aria-label="Toggle thinking">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1010 10A10 10 0 0012 2z"/>
            <path d="M12 6v4l3 3"/>
          </svg>
          <span class="dot-indicator"></span>
        </button>
        <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="empty-state" class="state active">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        <path d="M14 17l2 2 4-4" stroke-width="2"/>
      </svg>
      <p class="empty-heading">What do you want to say?</p>

      <div class="input-group">
        <label class="input-label" for="pointer-input">Reply Direction</label>
        <input id="pointer-input" type="text" class="input-main" placeholder='e.g. agree but suggest another day' maxlength="200" />
      </div>

      <button id="capture-btn" class="btn-capture">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Capture &amp; Suggest
      </button>

      <p class="hint">⌘ Shift R</p>
    </div>

    <div id="loading-state" class="state">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p id="loading-status">Capturing screenshot...</p>
        <div class="steps">
          <span class="step active" data-step="capture"></span>
          <span class="step" data-step="optimize"></span>
          <span class="step" data-step="analyze"></span>
        </div>
      </div>
    </div>

    <div id="results-state" class="state">
      <div id="suggestions-list"></div>
      <div class="results-footer">
        <span id="latency" class="latency"></span>
        <button id="regenerate-btn" class="link">Regenerate</button>
        <button id="new-capture-btn" class="link">New Capture</button>
      </div>
    </div>

    <div id="error-state" class="state">
      <p id="error-message">Something went wrong.</p>
      <button id="retry-btn" class="btn-capture">Retry</button>
    </div>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="../lib/capture.js"></script>
  <script src="../lib/api.js"></script>
  <script src="../lib/prompts.js"></script>
  <script src="../lib/utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
